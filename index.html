<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกม AR: คำมักเขียนผิด (โหมดท้าทาย)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Mali', cursive;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            touch-action: none;
        }

        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        #videoElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            pointer-events: auto;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer">
        <div id="startScreen" class="screen bg-slate-900/80">
            <div class="glass p-10 rounded-3xl text-center max-w-lg">
                <h1 class="text-4xl font-bold text-white mb-4">เกม AR ภาษาไทย</h1>
                <p class="text-xl text-blue-300 mb-2">โหมดท้าทาย: สุ่ม 5 ข้อ</p>
                <p class="text-md text-pink-300 mb-8">(ระวัง! ตอบผิดเกมจบกะทันหัน)</p>
                <button id="btnStart" class="bg-blue-500 hover:bg-blue-400 text-white font-bold py-4 px-8 border-b-4 border-blue-700 rounded-2xl text-2xl transition-all shadow-lg">
                    เข้าสู่เกม (Start)
                </button>
            </div>
        </div>

        <div id="inGameUI" class="hidden absolute top-0 left-0 w-full p-6 flex justify-between items-start pointer-events-none">
            <div class="glass px-6 py-3 rounded-2xl text-white text-xl font-bold flex flex-col gap-2">
                <div>ข้อที่: <span id="levelDisplay" class="text-blue-300">1/5</span></div>
                <div>คะแนน: <span id="scoreDisplay" class="text-yellow-300">0</span></div>
            </div>
            
            <div class="glass px-8 py-4 rounded-3xl text-white text-3xl font-bold text-center border-b-4 border-white/30">
                <span id="questionDisplay">โจทย์จะแสดงที่นี่</span>
            </div>

            <div class="glass px-6 py-3 rounded-2xl text-white text-xl font-bold">
                ตัวช่วย 💖: <span id="helpCardDisplay" class="text-pink-400">0</span>
            </div>
        </div>

        <div id="gameOverScreen" class="screen bg-red-900/90 hidden z-30">
            <div class="glass p-12 rounded-3xl text-center max-w-xl">
                <h1 class="text-6xl font-bold text-red-400 mb-4 drop-shadow-lg">GAME OVER!</h1>
                <p class="text-2xl text-white mb-6">ว้าาา... ตอบผิดซะแล้ว 😢</p>
                <div id="reviveSection" class="mb-6 hidden">
                    <p class="text-lg text-pink-200 mb-3">คุณมีบัตรตัวช่วย! ต้องการใช้แก้ตัวหรือไม่?</p>
                    <button id="btnRevive" class="bg-pink-500 hover:bg-pink-400 text-white font-bold py-3 px-8 border-b-4 border-pink-700 rounded-xl text-xl w-full mb-3 pointer-events-auto">
                        ใช้บัตรตัวช่วย (💖 เหลือ 1 ใบ)
                    </button>
                </div>
                <button id="btnRestart" class="bg-slate-600 hover:bg-slate-500 text-white font-bold py-3 px-8 border-b-4 border-slate-800 rounded-xl text-xl w-full pointer-events-auto">
                    เริ่มเกมใหม่ทั้งหมด
                </button>
            </div>
        </div>

        <div id="endScreen" class="screen bg-slate-900/95 hidden">
            <div class="glass p-12 rounded-3xl text-center">
                <h1 class="text-6xl font-bold text-green-400 mb-4 drop-shadow-lg">สุดยอดมาก! 🎉</h1>
                <p class="text-2xl text-white mb-6">คุณเอาชนะโหมดท้าทายได้สำเร็จ!</p>
                <p class="text-xl text-yellow-300 mb-8">คะแนนรวม: <span id="finalScoreDisplay"></span></p>
                <button onclick="location.reload()" class="bg-green-500 hover:bg-green-400 text-white font-bold py-3 px-8 border-b-4 border-green-700 rounded-xl text-xl pointer-events-auto shadow-lg">
                    สุ่มเล่นอีกรอบ
                </button>
            </div>
        </div>
    </div>

<script>
    // --- Data Pool (คลังโจทย์แบบยาก) ---
    const allQuestionsPool = [
        { q: "คำใดเขียนถูกต้อง? (พะ...)", words: [{text:"พะแนง", isCorrect:true, emoji:"🍛"}, {text:"แพนง", isCorrect:false, emoji:"🍛"}] },
        { q: "คำใดเขียนถูกต้อง? (มุก...)", words: [{text:"มุกตลก", isCorrect:true, emoji:"🤡"}, {text:"มุขตลก", isCorrect:false, emoji:"🤡"}] },
        { q: "คำใดเขียนถูกต้อง? (กะ...)", words: [{text:"กะเทย", isCorrect:true, emoji:"🏳️‍🌈"}, {text:"กระเทย", isCorrect:false, emoji:"🏳️‍🌈"}] },
        { q: "คำใดเขียนถูกต้อง? (ทะ...)", words: [{text:"ทะมัดทะแมง", isCorrect:true, emoji:"🏃"}, {text:"ทะมัดทแมง", isCorrect:false, emoji:"🏃"}] },
        { q: "คำใดเขียนถูกต้อง? (อา...)", words: [{text:"อานิสงส์", isCorrect:true, emoji:"🙏"}, {text:"อานิสงค์", isCorrect:false, emoji:"🙏"}] },
        { q: "คำใดเขียนถูกต้อง? (เวท...)", words: [{text:"เวทมนตร์", isCorrect:true, emoji:"🧙"}, {text:"เวทมนต์", isCorrect:false, emoji:"🧙"}] },
        { q: "คำใดเขียนถูกต้อง? (กัง...)", words: [{text:"กังวาน", isCorrect:true, emoji:"🔔"}, {text:"กังวาล", isCorrect:false, emoji:"🔔"}] },
        { q: "คำใดเขียนถูกต้อง? (โล...)", words: [{text:"โลกาภิวัตน์", isCorrect:true, emoji:"🌍"}, {text:"โลกาภิวัฒน์", isCorrect:false, emoji:"🌍"}] },
        { q: "คำใดเขียนถูกต้อง? (สัม...)", words: [{text:"สัมมนา", isCorrect:true, emoji:"👔"}, {text:"สัมนา", isCorrect:false, emoji:"👔"}] },
        { q: "คำใดเขียนถูกต้อง? (กะ...)", words: [{text:"กะพริบ", isCorrect:true, emoji:"👁️"}, {text:"กระพริบ", isCorrect:false, emoji:"👁️"}] },
        { q: "คำใดเขียนถูกต้อง? (ทย...)", words: [{text:"ทยอย", isCorrect:true, emoji:"🚶"}, {text:"ทะยอย", isCorrect:false, emoji:"🚶"}] },
        { q: "คำใดเขียนถูกต้อง? (พิ...)", words: [{text:"พิถีพิถัน", isCorrect:true, emoji:"💎"}, {text:"พิถีพิถรรณ", isCorrect:false, emoji:"💎"}] },
        { q: "คำใดเขียนถูกต้อง? (หยา...)", words: [{text:"หยากไย่", isCorrect:true, emoji:"🕸️"}, {text:"หยากไหย่", isCorrect:false, emoji:"🕸️"}] },
        { q: "คำใดเขียนถูกต้อง? (กะ...)", words: [{text:"กะเพรา", isCorrect:true, emoji:"🌿"}, {text:"กระเพรา", isCorrect:false, emoji:"🌿"}] },
        { q: "คำใดเขียนถูกต้อง? (รส...)", words: [{text:"รสชาติ", isCorrect:true, emoji:"😋"}, {text:"รสชาด", isCorrect:false, emoji:"😋"}] },
        { q: "คำใดเขียนถูกต้อง? (อนุ...)", words: [{text:"อนุญาต", isCorrect:true, emoji:"📝"}, {text:"อนุญาติ", isCorrect:false, emoji:"📝"}] },
        { q: "คำใดเขียนถูกต้อง? (สัง...)", words: [{text:"สังเกต", isCorrect:true, emoji:"👁️"}, {text:"สังเกตุ", isCorrect:false, emoji:"👁️"}] },
        { q: "คำใดเขียนถูกต้อง? (โอ...)", words: [{text:"โอกาส", isCorrect:true, emoji:"⭐"}, {text:"โอกาศ", isCorrect:false, emoji:"⭐"}] },
        { q: "คำใดเขียนถูกต้อง? (ผัด...)", words: [{text:"ผัดไทย", isCorrect:true, emoji:"🍜"}, {text:"ผัดไท", isCorrect:false, emoji:"🍜"}] },
        { q: "คำใดเขียนถูกต้อง? (ไอ...)", words: [{text:"ไอศกรีม", isCorrect:true, emoji:"🍦"}, {text:"ไอศครีม", isCorrect:false, emoji:"🍦"}] },
        { q: "คำใดเขียนถูกต้อง? (ศี...)", words: [{text:"ศีรษะ", isCorrect:true, emoji:"👤"}, {text:"ศรีษะ", isCorrect:false, emoji:"👤"}] },
        { q: "คำใดเขียนถูกต้อง? (ปรา...)", words: [{text:"ปรากฏ", isCorrect:true, emoji:"✨"}, {text:"ปรากฎ", isCorrect:false, emoji:"✨"}] },
        { q: "คำใดเขียนถูกต้อง? (กฎ...)", words: [{text:"กฎหมาย", isCorrect:true, emoji:"⚖️"}, {text:"กฏหมาย", isCorrect:false, emoji:"⚖️"}] },
        { q: "คำใดเขียนถูกต้อง? (สับ...)", words: [{text:"สับปะรด", isCorrect:true, emoji:"🍍"}, {text:"สัปปะรด", isCorrect:false, emoji:"🍍"}] },
        { q: "คำใดเขียนถูกต้อง? (อัญ...)", words: [{text:"อัญชัน", isCorrect:true, emoji:"🌸"}, {text:"อัญชัญ", isCorrect:false, emoji:"🌸"}] },
        { q: "คำใดเขียนถูกต้อง? (ไข่...)", words: [{text:"ไข่มุก", isCorrect:true, emoji:"🧋"}, {text:"ไข่มุข", isCorrect:false, emoji:"🧋"}] },
        { q: "คำใดเขียนถูกต้อง? (ผูก...)", words: [{text:"ผูกพัน", isCorrect:true, emoji:"🤝"}, {text:"ผูกพันธ์", isCorrect:false, emoji:"🤝"}] }
     ];

    let activeLevels = [];
    let currentLevelIndex = 0;
    let score = 0;
    let gameState = "START"; // START, INSTRUCTION, PLAYING, GAME_OVER, END
    let hasHelpCard = false;
    
    // Canvas & Context
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const videoElement = document.getElementById('videoElement');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- AR Entities ---
    let cards = [];
    let dropZone = {};
    let instructionBtn = {};

    // Cursor State
    const CURSOR_NORMAL = 0;
    const CURSOR_HOVER = 1;
    const CURSOR_MISS = 2;
    const CURSOR_GRABBING = 3;

    let cursor = {
        x: canvas.width / 2, y: canvas.height / 2,
        isPinching: false, state: CURSOR_NORMAL,
        grabbedCard: null, usingMouse: false
    };

    let latestHandResults = null;
    let handsDetected = false;

    // --- Setup & Game Flow ---
    function startInstruction() {
        gameState = "INSTRUCTION";
        document.getElementById('startScreen').classList.add('hidden');
        instructionBtn = { x: canvas.width/2 - 100, y: canvas.height/2 - 40, w: 200, h: 80, text: "เริ่มลุย!" };
    }

    function initGame() {
        // 1. Shuffle and pick 5 questions
        const shuffled = [...allQuestionsPool].sort(() => 0.5 - Math.random());
        activeLevels = shuffled.slice(0, 5);
        
        // 2. Reset Stats
        currentLevelIndex = 0;
        score = 0;
        
        // 3. Randomly give 1 Help Card (60% chance)
        hasHelpCard = Math.random() < 0.6;
        
        loadLevel(0);
    }

    function loadLevel(index) {
        if(index >= activeLevels.length) {
            gameState = "END";
            document.getElementById('inGameUI').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');
            document.getElementById('finalScoreDisplay').innerText = score;
            return;
        }
        
        gameState = "PLAYING";
        document.getElementById('inGameUI').classList.remove('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        
        document.getElementById('questionDisplay').innerText = activeLevels[index].q;
        document.getElementById('scoreDisplay').innerText = score;
        document.getElementById('levelDisplay').innerText = `${index + 1} / 5`;
        document.getElementById('helpCardDisplay').innerText = hasHelpCard ? "1 ใบ" : "0 ใบ";

        // Generate Cards
        cards = [];
        const levelData = activeLevels[index];
        // Shuffle the 2 words so correct answer isn't always on the left
        const randomizedWords = [...levelData.words].sort(() => 0.5 - Math.random());

        randomizedWords.forEach((wordObj, i) => {
            cards.push({
                x: (canvas.width / 3) * (i + 1) - 60,
                y: canvas.height / 4 + Math.random() * 50,
                w: 160, h: 200,
                text: wordObj.text, emoji: wordObj.emoji,
                isCorrect: wordObj.isCorrect,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5
            });
        });

        dropZone = { x: canvas.width/2 - 180, y: canvas.height - 200, w: 360, h: 120 };
    }

    function triggerGameOver() {
        gameState = "GAME_OVER";
        cursor.grabbedCard = null; // ปล่อยการ์ดที่จับอยู่
        document.getElementById('gameOverScreen').classList.remove('hidden');
        document.getElementById('inGameUI').classList.add('hidden');

        const reviveSection = document.getElementById('reviveSection');
        if (hasHelpCard) {
            reviveSection.classList.remove('hidden');
        } else {
            reviveSection.classList.add('hidden');
        }
    }

    // --- Button Event Listeners ---
    document.getElementById('btnStart').addEventListener('click', startInstruction);
    
    document.getElementById('btnRestart').addEventListener('click', () => {
        location.reload(); // เริ่มใหม่ทั้งหมดง่ายสุด
    });

    document.getElementById('btnRevive').addEventListener('click', () => {
        if (hasHelpCard) {
            hasHelpCard = false;
            // โหลดด่านเดิมที่พลาดไปอีกครั้ง
            loadLevel(currentLevelIndex);
        }
    });

    // --- Input Handling ---
    function handleInputMove(x, y) { cursor.x = x; cursor.y = y; cursor.usingMouse = true; }
    function handleInputDown() { cursor.isPinching = true; cursor.usingMouse = true; }
    function handleInputUp() { cursor.isPinching = false; cursor.usingMouse = true; }

    canvas.addEventListener('mousemove', (e) => handleInputMove(e.clientX, e.clientY));
    canvas.addEventListener('mousedown', handleInputDown);
    canvas.addEventListener('mouseup', handleInputUp);
    canvas.addEventListener('touchmove', (e) => handleInputMove(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
    canvas.addEventListener('touchstart', (e) => { handleInputMove(e.touches[0].clientX, e.touches[0].clientY); handleInputDown(); }, {passive: false});
    canvas.addEventListener('touchend', handleInputUp);

    // --- MediaPipe Setup ---
    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.5 });
    hands.onResults((results) => { latestHandResults = results; });
    const camera = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 1280, height: 720 });
    camera.start();

    // --- Game Logic ---
    function checkCollision(cx, cy, rect) {
        return cx >= rect.x && cx <= rect.x + rect.w && cy >= rect.y && cy <= rect.y + rect.h;
    }

    function update() {
        handsDetected = false;

        // Hand Tracking Data Update
        if (latestHandResults && latestHandResults.multiHandLandmarks && latestHandResults.multiHandLandmarks.length > 0) {
            handsDetected = true;
            cursor.usingMouse = false;
            const landmarks = latestHandResults.multiHandLandmarks[0];
            const indexTip = landmarks[8];
            cursor.x = (1 - indexTip.x) * canvas.width;
            cursor.y = indexTip.y * canvas.height;
            const thumbTip = landmarks[4];
            const dx = ((1 - thumbTip.x) * canvas.width) - cursor.x;
            const dy = (thumbTip.y * canvas.height) - cursor.y;
            cursor.isPinching = Math.sqrt(dx*dx + dy*dy) < 40; 
        }

        cursor.state = CURSOR_NORMAL;
        let isHoveringSomething = false;

        if (gameState === "INSTRUCTION") {
            if (checkCollision(cursor.x, cursor.y, instructionBtn)) {
                isHoveringSomething = true;
                if (cursor.isPinching) initGame();
                else cursor.state = CURSOR_HOVER;
            }
        } 
        else if (gameState === "PLAYING") {
            // Floating Logic
            cards.forEach(card => {
                if (cursor.grabbedCard !== card) {
                    card.x += card.vx; card.y += card.vy;
                    if(card.x <= 0 || card.x + card.w >= canvas.width) card.vx *= -1;
                    if(card.y <= 0 || card.y + card.h >= canvas.height / 1.5) card.vy *= -1;
                }
            });

            // Grab Logic
            if (cursor.grabbedCard) {
                cursor.state = CURSOR_GRABBING;
                isHoveringSomething = true;
                cursor.grabbedCard.x = cursor.x - cursor.grabbedCard.w / 2;
                cursor.grabbedCard.y = cursor.y - cursor.grabbedCard.h / 2;

                if (!cursor.isPinching) {
                    if (checkCollision(cursor.x, cursor.y, dropZone)) {
                        if (cursor.grabbedCard.isCorrect) {
                            // ตอบถูก
                            score += 100;
                            currentLevelIndex++;
                            setTimeout(() => loadLevel(currentLevelIndex), 300);
                        } else {
                            // ตอบผิด!
                            triggerGameOver();
                        }
                    }
                    cursor.grabbedCard = null;
                }
            } else {
                for (let i = cards.length - 1; i >= 0; i--) {
                    if (checkCollision(cursor.x, cursor.y, cards[i])) {
                        isHoveringSomething = true;
                        if (cursor.isPinching) {
                            cursor.grabbedCard = cards[i];
                            cursor.state = CURSOR_GRABBING;
                        } else cursor.state = CURSOR_HOVER;
                        break;
                    }
                }
            }
        }

        if (cursor.isPinching && !cursor.grabbedCard && !isHoveringSomething) cursor.state = CURSOR_MISS;
    }

    // --- Render Loop ---
    function drawLoop() {
        update();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (handsDetected && latestHandResults && !cursor.usingMouse && gameState !== "GAME_OVER") {
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            const landmarks = latestHandResults.multiHandLandmarks[0];
            window.drawConnectors(ctx, landmarks, window.HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
            window.drawLandmarks(ctx, landmarks, {color: '#3b82f6', lineWidth: 1, radius: 3});
            ctx.restore();
        }

        if ((gameState === "PLAYING" || gameState === "INSTRUCTION") && !handsDetected && !cursor.usingMouse) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fillRect(0, 0, canvas.width, 40);
            ctx.fillStyle = "#fbbf24";
            ctx.font = "bold 20px 'Mali'";
            ctx.textAlign = "center";
            ctx.fillText("กำลังหามือของคุณ... หรือใช้เมาส์คลิกเพื่อเล่น", canvas.width / 2, 28);
        }

        if (gameState === "INSTRUCTION") {
            ctx.fillStyle = cursor.state === CURSOR_HOVER ? "#f472b6" : "#ec4899"; // Pink button
            ctx.beginPath();
            ctx.roundRect(instructionBtn.x, instructionBtn.y, instructionBtn.w, instructionBtn.h, 25);
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(255,255,255,0.7)";
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 32px 'Mali'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(instructionBtn.text, instructionBtn.x + instructionBtn.w/2, instructionBtn.y + instructionBtn.h/2);
        }
        else if (gameState === "PLAYING") {
            // Drop Zone
            ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
            ctx.beginPath();
            ctx.roundRect(dropZone.x, dropZone.y, dropZone.w, dropZone.h, 20);
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
            ctx.setLineDash([15, 10]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            ctx.font = "bold 26px 'Mali'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("วางคำที่ถูกต้องที่นี่", dropZone.x + dropZone.w/2, dropZone.y + dropZone.h/2);

            // Cards
            cards.forEach(card => {
                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.beginPath();
                ctx.roundRect(card.x + 8, card.y + 12, card.w, card.h, 20);
                ctx.fill();

                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                ctx.beginPath();
                ctx.roundRect(card.x, card.y, card.w, card.h, 20);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#cbd5e1";
                ctx.stroke();

                ctx.font = "70px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(card.emoji, card.x + card.w/2, card.y + card.h/2 - 25);

                ctx.fillStyle = "#0f172a";
                ctx.font = "bold 26px 'Mali'";
                ctx.fillText(card.text, card.x + card.w/2, card.y + card.h - 35);
            });
        }

        // Cursor
        if (gameState !== "START" && gameState !== "END" && gameState !== "GAME_OVER") {
            ctx.beginPath();
            let radius = 15;
            if (cursor.state === CURSOR_NORMAL) {
                ctx.fillStyle = "rgba(59, 130, 246, 0.8)";
                ctx.arc(cursor.x, cursor.y, radius, 0, Math.PI * 2);
                ctx.fill();
            } else if (cursor.state === CURSOR_HOVER) {
                ctx.strokeStyle = "#facc15";
                ctx.lineWidth = 5;
                ctx.setLineDash([6, 4]);
                ctx.arc(cursor.x, cursor.y, radius + 8, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            } else if (cursor.state === CURSOR_MISS) {
                ctx.fillStyle = "rgba(239, 68, 68, 0.8)";
                ctx.arc(cursor.x, cursor.y, radius - 3, 0, Math.PI * 2);
                ctx.fill();
            } else if (cursor.state === CURSOR_GRABBING) {
                ctx.fillStyle = "rgba(34, 197, 94, 0.9)";
                ctx.arc(cursor.x, cursor.y, radius + 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("✔️", cursor.x, cursor.y);
            }
        }

        requestAnimationFrame(drawLoop);
    }

    requestAnimationFrame(drawLoop);
</script>
